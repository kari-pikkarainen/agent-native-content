[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-ir-bench"
version = "0.1.0"
description = "Benchmark for structure-aware context compilation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.126.0,<3",
    "numpy>=2.0,<3",
    "pydantic>=2.11.0,<3",
    "tiktoken>=0.14.0,<1",
    "typer>=0.12.0,<1",
]

[project.optional-dependencies]
generation = [
    "openai>=2.0.0,<3",
]
retrieval = [
    "sentence-transformers>=3.0.0,<6",
]

[project.scripts]
contextbench = "contextbench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10",
    "reportlab>=4.2.0,<5",
    "ruff>=0.11.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/contextbench"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

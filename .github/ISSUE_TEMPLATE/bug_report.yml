name: Bug report
description: Report a reproducible defect in the code, documentation, or benchmark tooling.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include credentials, private
        source documents, or unpublished benchmark answers.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest command, configuration, or fixture that reproduces the problem.
      render: shell
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Git commit
      description: The complete commit identifier used for the reproduction.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, Python version, uv version, and relevant model or parser versions.
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Remove credentials, personal paths, private content, and other sensitive data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no credentials or private source content.
          required: true
